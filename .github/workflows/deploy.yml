name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./StylX
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx expo export --platform web
        env:
          NODE_ENV: production

      - run: sed -i 's|src="/_expo/|src="/StylX/_expo/|g' dist/index.html

      - run: sed -i 's|href="/favicon|href="/StylX/favicon|g' dist/index.html

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./StylX/dist